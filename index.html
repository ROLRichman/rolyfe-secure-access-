<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RO’Lyfe Secure Access</title>

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --green:#22c55e;
  --green2:#16a34a;
  --blue:#0ea5e9;
  --gold:#facc15;
  --text:#ffffff;
  --muted:#cbd5e1;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(rgba(2,6,23,.88),rgba(2,6,23,.92)),
    url('https://raw.githubusercontent.com/ROLRichman/rolyfe-funding/main/rolyfe-funding-hero.png')
    center center/cover no-repeat fixed;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.bg-glow{
  position:fixed;
  width:500px;
  height:500px;
  background:radial-gradient(circle,var(--green),transparent 70%);
  filter:blur(90px);
  opacity:.15;
  animation:floatGlow 8s infinite ease-in-out;
}

@keyframes floatGlow{
  0%{transform:translateY(0px)}
  50%{transform:translateY(-40px)}
  100%{transform:translateY(0px)}
}

.login-box{
  width:min(92%,480px);
  background:rgba(15,23,42,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:30px;
  backdrop-filter:blur(12px);
  box-shadow:0 0 40px rgba(0,0,0,.45);
  position:relative;
  z-index:2;
}

.logo{
  width:110px;
  display:block;
  margin:auto;
  border-radius:18px;
  box-shadow:0 0 20px rgba(34,197,94,.35);
}

h1{
  text-align:center;
  margin:18px 0 10px;
  font-size:34px;
  font-weight:900;
}

.sub{
  text-align:center;
  color:var(--muted);
  line-height:1.5;
  margin-bottom:28px;
}

.ai-bar{
  background:linear-gradient(90deg,var(--green),var(--blue));
  padding:12px;
  border-radius:14px;
  text-align:center;
  font-weight:900;
  margin-bottom:22px;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 10px rgba(34,197,94,.2)}
  50%{box-shadow:0 0 28px rgba(14,165,233,.7)}
  100%{box-shadow:0 0 10px rgba(34,197,94,.2)}
}

input{
  width:100%;
  padding:18px;
  margin:12px 0;
  border:none;
  border-radius:16px;
  font-size:17px;
  outline:none;
}

button{
  width:100%;
  border:none;
  border-radius:16px;
  padding:18px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,var(--green),var(--green2));
  margin-top:14px;
  transition:.25s;
}

button:hover{
  transform:scale(1.02);
}

.links{
  margin-top:24px;
  display:grid;
  gap:12px;
}

.links a{
  text-decoration:none;
  color:white;
  background:#111827;
  border-radius:14px;
  padding:14px;
  text-align:center;
  font-weight:700;
  border:1px solid rgba(255,255,255,.06);
}

.footer{
  text-align:center;
  margin-top:22px;
  color:#94a3b8;
  font-size:13px;
}

.lock{
  font-size:55px;
  text-align:center;
}

</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="login-box">

<div class="lock">🔐</div>

<h1>RO’Lyfe Secure Access</h1>

<p class="sub">
Funding • Execution • Contracts • AI Guidance • Lending Access
</p>

<div class="ai-bar">
🤖 Jamal AI Connected & Ready
</div>

<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">

<button onclick="loginNow()">
🚀 ACCESS EXECUTION HUB
</button>

<div class="links">
<a href="https://rolrichman.github.io/rolyfe-funding/" target="_blank">
🏦 Open Funding Hub
</a>

<a href="https://rolrichman.github.io/rolyfe-contract-documents-hub/" target="_blank">
📄 Contract & Document Hub
</a>

<a href="https://agent.jotform.com/019bdd1fe57172838101dccf3612b1e9e787" target="_blank">
🤖 Open Jamal AI
</a>
</div>

<div class="footer">
Built By Richardson L. • Root Of Lyfe Holdings LLC
</div>

</div>

<script>
function loginNow(){

  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if(!email || !pass){
    alert("Enter email & password");
    return;
  }

  // fake secure gate for Systeme embed
  localStorage.setItem("rolyfeAccess","granted");

  alert("✅ ACCESS GRANTED");

  window.location.href =
  "https://rolrichman.github.io/rolyfe-funding/";
}
</script>

</body>
</html>
