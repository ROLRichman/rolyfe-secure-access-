<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RO’Lyfe Secure Access</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<main class="login-shell">

  <section class="hero-banner">
    <img src="rolyfe-login-hero.png" alt="RO’Lyfe Secure Access">
  </section>

  <section class="login-card">
    <div class="lock-icon">🔐</div>

    <h1>RO’Lyfe Secure Access</h1>

    <p class="sub">
      Funding • Execution • Contracts • AI Guidance • Lending Access
    </p>

    <div class="jamal-status">
      🤖 Jamal AI Connected & Ready
    </div>

    <input id="email" type="email" placeholder="Enter Email">
    <input id="password" type="password" placeholder="Enter Access Code">

    <button class="unlock-btn" onclick="loginAccess()">
      🚀 Unlock Access
    </button>

    <button class="jamal-btn" onclick="openJamal()">
      🤖 Ask Jamal AI
    </button>

    <p class="small-note">
      Private • Secure • RO’Lyfe Execution Systems
    </p>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
